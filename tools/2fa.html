<!doctype html>
<!--
  개인용 2단계 인증 숫자 만들기 (TOTP, Google·Microsoft Authenticator 와 같은 계산)
  - 이 파일 하나만 브라우저로 열면 됩니다 (PC·휴대폰, 인터넷 없어도 됨).
  - 비밀 키는 어디로도 보내지 않습니다. 아래 Content-Security-Policy 로 외부 연결 자체를 막아 둠.
  - 비밀 키는 이 파일에 적지 마세요 (저장소에 올라가면 누구나 숫자를 만들 수 있음).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<meta name="referrer" content="no-referrer">
<title>2단계 인증 숫자</title>
<style>
  :root { --bg: #fff1e1; --card: #fffaf3; --line: #f6d6b4; --orange: #f39a3f; --ink: #43260f; --sub: #9a6b45; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
         font: 15px/1.5 "맑은 고딕", "Malgun Gothic", system-ui, sans-serif; display: flex; justify-content: center; }
  main { width: 100%; max-width: 440px; padding: 24px 16px 40px; }
  h1 { font-size: 20px; margin: 4px 0 4px; }
  p.note { color: var(--sub); font-size: 13px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px 18px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--sub); margin: 8px 0 4px; }
  input { width: 100%; padding: 10px 14px; border: 1px solid #f0b27a; border-radius: 999px; font: inherit; background: #fff; color: var(--ink); }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button { border: 0; border-radius: 999px; padding: 9px 16px; font: inherit; font-weight: 700; cursor: pointer;
           background: var(--orange); color: #fff; }
  button.sub { background: #fbd3a8; color: #6b3f17; }
  .code { font: 700 40px/1.1 Consolas, "Courier New", monospace; letter-spacing: 6px; cursor: pointer; user-select: all; }
  .name { font-weight: 700; }
  .bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--orange); border-radius: 999px; }
  .left { font-size: 12px; color: var(--sub); }
  .err { color: #d63a2f; font-size: 13px; margin-top: 6px; min-height: 1em; }
  .chk { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--sub); margin-top: 10px; }
  .chk input { width: auto; }
  .x { background: transparent; color: var(--sub); padding: 4px 8px; font-weight: 400; }
</style>
</head>
<body>
<main>
  <h1>🔐 2단계 인증 숫자</h1>
  <p class="note">GitHub 등에서 2단계 인증 앱을 등록할 때 나오는 <b>설정 키(setup key)</b>를 넣으면, 인증 앱과 똑같은 6자리 숫자가 30초마다 바뀌며 나옵니다. 아무 데도 보내지 않고 이 페이지 안에서만 계산합니다.</p>

  <div class="card">
    <label for="name">이름 (예: GitHub)</label>
    <input id="name" placeholder="GitHub" autocomplete="off">
    <label for="secret">설정 키 또는 otpauth:// 주소</label>
    <input id="secret" placeholder="JBSW Y3DP EHPK 3PXP …" autocomplete="off" spellcheck="false">
    <label class="chk"><input type="checkbox" id="remember"> 이 브라우저에 기억 (내 컴퓨터에서만 켜세요)</label>
    <div class="row"><button id="add">숫자 보기</button></div>
    <div class="err" id="err"></div>
  </div>

  <div id="list"></div>
</main>

<script>
// ---- TOTP 계산 (RFC 6238 / 4226): 비밀 키로 '지금이 몇 번째 30초인지'를 HMAC-SHA1 한 뒤 6자리를 뽑는다 ----
// TOTP-BEGIN
function base32ToBytes(s) {
  const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  s = s.toUpperCase().replace(/[\s-]/g, "").replace(/=+$/, "");
  let bits = 0, val = 0; const out = [];
  for (const ch of s) {
    const i = abc.indexOf(ch);
    if (i < 0) throw new Error("설정 키에 쓸 수 없는 글자가 있어요: " + ch);
    val = (val << 5) | i; bits += 5;
    if (bits >= 8) { bits -= 8; out.push((val >>> bits) & 255); }
  }
  if (!out.length) throw new Error("설정 키가 비어 있어요");
  return out;
}

function sha1(bytes) {
  const h = [0x67452301, 0xEFCDAB89, 0x98BADCFE, 0x10325476, 0xC3D2E1F0];
  const ml = bytes.length * 8;
  const m = bytes.slice(); m.push(0x80);
  while (m.length % 64 !== 56) m.push(0);
  for (let i = 7; i >= 0; i--) m.push(i >= 4 ? 0 : (ml >>> (i * 8)) & 255);   // 길이(비트) 64비트
  const w = new Array(80);
  for (let o = 0; o < m.length; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = (m[o + 4 * i] << 24) | (m[o + 4 * i + 1] << 16) | (m[o + 4 * i + 2] << 8) | m[o + 4 * i + 3];
    for (let i = 16; i < 80; i++) { const x = w[i - 3] ^ w[i - 8] ^ w[i - 14] ^ w[i - 16]; w[i] = (x << 1) | (x >>> 31); }
    let [a, b, c, d, e] = h;
    for (let i = 0; i < 80; i++) {
      const f = i < 20 ? (b & c) | (~b & d) : i < 40 ? b ^ c ^ d : i < 60 ? (b & c) | (b & d) | (c & d) : b ^ c ^ d;
      const k = i < 20 ? 0x5A827999 : i < 40 ? 0x6ED9EBA1 : i < 60 ? 0x8F1BBCDC : 0xCA62C1D6;
      const t = (((a << 5) | (a >>> 27)) + f + e + k + w[i]) | 0;
      e = d; d = c; c = (b << 30) | (b >>> 2); b = a; a = t;
    }
    h[0] = (h[0] + a) | 0; h[1] = (h[1] + b) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0; h[4] = (h[4] + e) | 0;
  }
  const out = [];
  for (const x of h) out.push((x >>> 24) & 255, (x >>> 16) & 255, (x >>> 8) & 255, x & 255);
  return out;
}

function hmacSha1(key, msg) {
  if (key.length > 64) key = sha1(key);
  const k = key.concat(new Array(64 - key.length).fill(0));
  return sha1(k.map(b => b ^ 0x5c).concat(sha1(k.map(b => b ^ 0x36).concat(msg))));
}

function totp(secret, seconds, digits = 6, step = 30) {
  const counter = Math.floor(seconds / step);
  const msg = [];
  const hi = Math.floor(counter / 4294967296), lo = counter >>> 0;
  for (const v of [hi, lo]) msg.push((v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255);
  const h = hmacSha1(base32ToBytes(secret), msg);
  const o = h[19] & 15;
  const n = ((h[o] & 127) << 24) | (h[o + 1] << 16) | (h[o + 2] << 8) | h[o + 3];
  return String(n % 10 ** digits).padStart(digits, "0");
}

function parseInput(text) {
  // otpauth://totp/GitHub:아이디?secret=XXXX&issuer=GitHub 를 붙여 넣어도 됨
  text = text.trim();
  if (text.startsWith("otpauth://")) {
    const u = new URL(text);
    const label = decodeURIComponent(u.pathname.replace(/^\/+totp\//, "").replace(/^\/+/, ""));
    return { secret: u.searchParams.get("secret") || "", name: u.searchParams.get("issuer") || label,
             digits: +(u.searchParams.get("digits") || 6), period: +(u.searchParams.get("period") || 30) };
  }
  return { secret: text, name: "", digits: 6, period: 30 };
}
// TOTP-END

// ---- 화면 ----
const KEY = "taskpet-2fa";
let items = [];
try { items = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { items = []; }

function save() {
  const keep = items.filter(x => x.keep).map(({ name, secret, digits, period }) => ({ name, secret, digits, period, keep: true }));
  try { localStorage.setItem(KEY, JSON.stringify(keep)); } catch (e) { }
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  items.forEach((it, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="row" style="margin:0;justify-content:space-between">
        <span class="name"></span><button class="x" title="지우기">✕</button></div>
      <div class="code" title="누르면 복사"></div>
      <div class="bar"><i></i></div><div class="left"></div>`;
    card.querySelector(".name").textContent = it.name + (it.keep ? " · 기억됨" : "");
    card.querySelector(".x").onclick = () => { items.splice(i, 1); save(); render(); };
    card.querySelector(".code").onclick = e => {
      navigator.clipboard && navigator.clipboard.writeText(e.target.dataset.v || "");
      e.target.style.opacity = .5; setTimeout(() => e.target.style.opacity = 1, 200);
    };
    it.el = card;
    list.appendChild(card);
  });
  tick();
}

function tick() {
  const now = Date.now() / 1000;
  for (const it of items) {
    if (!it.el) continue;
    const left = it.period - (now % it.period);
    const code = totp(it.secret, now, it.digits, it.period);
    const el = it.el.querySelector(".code");
    el.dataset.v = code;
    el.textContent = code.slice(0, 3) + " " + code.slice(3);
    it.el.querySelector(".bar > i").style.width = (left / it.period * 100) + "%";
    it.el.querySelector(".left").textContent = Math.ceil(left) + "초 뒤 바뀜 · 숫자를 누르면 복사";
  }
}

document.getElementById("add").onclick = () => {
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    const p = parseInput(document.getElementById("secret").value);
    p.secret = p.secret.toUpperCase().replace(/[\s-]/g, "");
    totp(p.secret, Date.now() / 1000, p.digits, p.period);        // 잘못된 키면 여기서 알림
    p.name = document.getElementById("name").value.trim() || p.name || "2단계 인증";
    p.keep = document.getElementById("remember").checked;
    items.push(p);
    save();
    document.getElementById("secret").value = "";
    render();
  } catch (e) {
    err.textContent = e.message || "설정 키를 확인해 주세요";
  }
};
document.getElementById("secret").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("add").click(); });
render();
setInterval(tick, 1000);
</script>
</body>
</html>
